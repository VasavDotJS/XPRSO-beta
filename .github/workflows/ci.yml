name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: orderplat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm tsc --noEmit

      - name: Run Unit & Integration Tests
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/orderplat_test
          SESSION_SECRET: ci-secret-must-be-at-least-32-characters-long
          APP_DOMAIN: localhost:3000
        run: pnpm test

      - name: Build Next.js App
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/orderplat_test
          SESSION_SECRET: ci-secret-must-be-at-least-32-characters-long
          APP_DOMAIN: localhost:3000
        run: pnpm build

  docker:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t xprso-order-plat:latest .
